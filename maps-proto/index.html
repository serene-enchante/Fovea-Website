<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maps Proto</title>
  <link rel="stylesheet" href="./styles/frame-layout.css">
  <link rel="stylesheet" href="./assets/google-icons/material-symbols-rounded.css">
  <link rel="stylesheet" href="./styles/components/page-list.css">
  <link rel="stylesheet" href="./styles/components/organization-rail.css">
  <link rel="stylesheet" href="./styles/components/user-profile.css">
  <link rel="stylesheet" href="./styles/frames/material-plain.css">
  <link rel="stylesheet" href="./styles/frames/material-bare.css">
  <link rel="stylesheet" href="./styles/frames/material-floating-window.css">
  <link rel="stylesheet" href="./styles/frames/animations.css">
  <link rel="stylesheet" href="./styles/components/toolbar.css">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("fovea-theme") || "dark";
        const systemIsLight = window.matchMedia?.("(prefers-color-scheme: light)").matches;
        if (theme === "light" || (theme === "auto" && systemIsLight)) {
          document.documentElement.dataset.theme = "light";
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div class="frame-layout" id="frame-layout" data-directory-src="./directory.json" data-toolbar-src="./toolbar.json">
    <template id="app-frame-template">
      <section class="app-frame" role="region">
        <div class="app-frame__content"></div>
      </section>
    </template>
  </div>
  <script type="module" src="./scripts/index.js"></script>
</body>
</html>
