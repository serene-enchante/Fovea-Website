<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>fovea</title>
    <meta name="description" content="Fovea - Spatial mapping and count circle data engine. Search and access Christmas Bird Count circles.">

    <!-- Fonts & Icons -->
    <link rel="icon" type="image/png" href="images/logo-fav.png">

    <style>
        @font-face {
            font-family: 'Aliceregular';
            src: url('fonts/alice-fontfacekit/web%20fonts/alice_regular_macroman/Alice-Regular-webfont.woff2') format('woff2'),
                 url('fonts/alice-fontfacekit/web%20fonts/alice_regular_macroman/Alice-Regular-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --subtext-color: rgba(255, 255, 255, 0.45);
            --border-color: rgba(255, 255, 255, 0.12);
            --box-bg: rgba(255, 255, 255, 0.05);
            --box-hover-bg: rgba(255, 255, 255, 0.09);

            --accent-color: #64b5f6;
            --accent-light: #91cfff;
            --accent-hover: #79c1f8;
            --accent-rgb: 100, 181, 246;

            --accent-primary: var(--accent-color);
            --accent-green: var(--accent-color);

            --font-serif: 'Aliceregular', 'Alice', Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 10;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(300px, 50vw, 600px);
            height: clamp(300px, 50vw, 600px);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Logo Title */
        .logo-title {
            font-family: var(--font-serif);
            font-size: clamp(4.5rem, 11vw, 8.5rem);
            font-weight: 400;
            color: var(--text-color);
            text-transform: lowercase;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 2.25rem;
            user-select: none;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInLogo 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
        }

        @keyframes fadeInLogo {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search Form Wrapper */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            z-index: 20;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.25s;
        }

        @keyframes fadeInSearch {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #000000 !important;
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.75rem 1.25rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.09) !important;
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .search-icon {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .search-box:focus-within .search-icon {
            color: rgba(255, 255, 255, 0.8);
        }

        .search-input {
            position: relative;
            z-index: 2;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: var(--font-sans);
            font-weight: 400;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .search-clear {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .search-clear:hover {
            color: #ffffff;
        }

        /* Autocomplete Dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #000000 !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
            z-index: 50;
            padding: 0.4rem;
            display: none;
            overflow: visible !important;
            --mouse-x: 50%;
            --mouse-y: 50%;
            --glow-opacity: 0;
            --spotlight-size: 240px;
        }

        .autocomplete-scroll-container {
            max-height: 272px;
            overflow-y: auto;
            border-radius: 12px;
            position: relative;
            z-index: 2;
        }

        /* Proximity Glow for Autocomplete Dropdown */
        .autocomplete-dropdown::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 0;
            background: radial-gradient(
                var(--spotlight-size) circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.04) 0%,
                rgba(255, 255, 255, 0.01) 50%,
                transparent 75%
            );
        }

        .autocomplete-dropdown::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 17px;
            padding: 1px;
            background: radial-gradient(
                var(--spotlight-size) circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                transparent 75%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 1;
        }

        .autocomplete-item {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
            text-decoration: none;
            color: inherit;
        }

        .autocomplete-item:hover,
        .autocomplete-item.is-selected {
            background: rgba(255, 255, 255, 0.10);
        }

        .autocomplete-item__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .autocomplete-item:hover .autocomplete-item__icon {
            color: var(--accent-green);
        }

        .autocomplete-item__info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .autocomplete-item__title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .autocomplete-item__subtitle {
            font-size: 0.76rem;
            color: var(--subtext-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .no-results {
            padding: 1rem;
            text-align: center;
            font-size: 0.84rem;
            color: var(--subtext-color);
        }

        /* Bottom Quick Links Footer */
        .home-footer {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            opacity: 0;
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        .footer-link {
            font-size: 0.82rem;
            color: var(--subtext-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #ffffff;
        }

        /* Toast Popup Notification */
        .toast-notification {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 33, 40, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 0.75rem 1.4rem;
            border-radius: 9999px;
            font-size: 0.86rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.65rem;
            white-space: nowrap;
        }

        .toast-notification.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
    <link rel="stylesheet" href="styles/mobile-bottom-nav.css?v=12">
</head>

<body>
    <div class="ambient-glow"></div>
    <div id="toast-notification" class="toast-notification"></div>

    <main class="home-container">
        <h1 class="logo-title">fovea</h1>

        <div class="search-wrapper">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="home-search-input" class="search-input" placeholder="Search count circles (e.g. Eugene, Florence)..." autocomplete="off" spellcheck="false" />
                <button type="button" id="home-search-clear" class="search-clear" aria-label="Clear search" style="display: none;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="home-autocomplete" class="autocomplete-dropdown"></div>
        </div>

        <nav class="home-footer">
            <a href="maps/" class="footer-link">Interactive Map</a>
            <a href="info/" class="footer-link">Information</a>
            <a href="#" class="footer-link" data-coming-soon="Results Data">Results Data</a>
            <a href="#" class="footer-link" data-coming-soon="Directory">Directory</a>
        </nav>
    </main>

    <script>
        const COUNT_CIRCLES_DATA = [
            {
                name: "Eugene",
                title: "Eugene Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Eugene",
                logo: "images/logo-small.png",
                hasData: true
            },
            {
                name: "Florence",
                title: "Florence Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Florence",
                logo: "images/florence.png",
                hasData: true
            },
            {
                name: "Cottage Grove",
                title: "Cottage Grove Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Cottage%20Grove",
                hasData: false
            },
            {
                name: "Oakridge",
                title: "Oakridge Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Oakridge",
                hasData: false
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("home-search-input");
            const clearBtn = document.getElementById("home-search-clear");
            const dropdown = document.getElementById("home-autocomplete");
            let selectedIndex = -1;

            // Proximity Glow Effect for Search Box & Autocomplete Dropdown
            const setupProximityGlow = (element, threshold = 140, spotlightSize = 240) => {
                if (!element) return;
                
                element.style.setProperty("--mouse-x", "50%");
                element.style.setProperty("--mouse-y", "50%");
                element.style.setProperty("--glow-opacity", "0");
                element.style.setProperty("--spotlight-size", `${spotlightSize}px`);

                window.addEventListener("mousemove", (e) => {
                    if (window.getComputedStyle(element).display === "none") {
                        element.style.setProperty("--glow-opacity", "0");
                        return;
                    }

                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
                    const dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    element.style.setProperty("--mouse-x", `${x}px`);
                    element.style.setProperty("--mouse-y", `${y}px`);

                    let opacity = 0;
                    if (dist <= threshold) {
                        opacity = Math.pow(1 - dist / threshold, 1.2);
                    }

                    element.style.setProperty("--glow-opacity", opacity.toFixed(3));
                });
            };

            setupProximityGlow(dropdown, 140, 240);

            const renderDropdown = (query) => {
                const q = query.trim().toLowerCase();
                if (!q) {
                    dropdown.style.display = "none";
                    dropdown.innerHTML = "";
                    clearBtn.style.display = "none";
                    selectedIndex = -1;
                    return;
                }

                clearBtn.style.display = "flex";

                const matches = COUNT_CIRCLES_DATA.filter(circle => 
                    circle.name.toLowerCase().includes(q) ||
                    circle.title.toLowerCase().includes(q) ||
                    circle.subtitle.toLowerCase().includes(q)
                );

                if (matches.length === 0) {
                    dropdown.style.display = "block";
                    dropdown.innerHTML = `<div class="autocomplete-scroll-container"><div class="no-results">No count circle matching "${q}"</div></div>`;
                    selectedIndex = -1;
                    return;
                }

                dropdown.style.display = "block";
                const itemsHtml = matches.map((circle, index) => {
                    let iconHtml = "";
                    if (circle.hasData) {
                        iconHtml = `<img src="${circle.logo}" alt="${circle.name}" style="width: 100%; height: 100%; object-fit: contain;" />`;
                    } else {
                        iconHtml = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; opacity: 0.5;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                            </svg>
                        `;
                    }
                    return `
                        <a href="${circle.url}" class="autocomplete-item" data-index="${index}">
                            <div class="autocomplete-item__icon">
                                ${iconHtml}
                            </div>
                            <div class="autocomplete-item__info">
                                <div class="autocomplete-item__title">${circle.title}</div>
                                <div class="autocomplete-item__subtitle">${circle.subtitle}</div>
                            </div>
                        </a>
                    `;
                }).join("");

                dropdown.innerHTML = `<div class="autocomplete-scroll-container">${itemsHtml}</div>`;
                selectedIndex = -1;
            };

            input.addEventListener("input", (e) => {
                renderDropdown(e.target.value);
            });

            input.addEventListener("focus", (e) => {
                if (e.target.value.trim()) {
                    renderDropdown(e.target.value);
                }
            });

            clearBtn.addEventListener("click", () => {
                input.value = "";
                renderDropdown("");
                input.focus();
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".search-wrapper")) {
                    dropdown.style.display = "none";
                }
            });

            // Keyboard Navigation (Arrow keys + Enter)
            input.addEventListener("keydown", (e) => {
                const items = dropdown.querySelectorAll(".autocomplete-item");
                if (items.length === 0) return;

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    selectedIndex = (selectedIndex + 1) % items.length;
                    highlightItem(items);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    highlightItem(items);
                } else if (e.key === "Enter") {
                    if (selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        items[selectedIndex].click();
                    } else if (items.length > 0) {
                        e.preventDefault();
                        items[0].click();
                    }
                }
            });

            function highlightItem(items) {
                items.forEach((item, index) => {
                    if (index === selectedIndex) {
                        item.classList.add("is-selected");
                        item.scrollIntoView({ block: "nearest" });
                    } else {
                        item.classList.remove("is-selected");
                    }
                });
            }

            let toastTimer = null;
            function showComingSoonToast(featureName) {
                const toast = document.getElementById("toast-notification");
                if (!toast) return;
                toast.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: #00d5a4;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span><strong>${featureName}</strong> will be available soon</span>
                `;
                toast.classList.add("is-visible");
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove("is-visible");
                }, 2800);
            }

            document.querySelectorAll("[data-coming-soon]").forEach(el => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const name = el.getAttribute("data-coming-soon");
                    showComingSoonToast(name);
                });
            });

            // Wire up mobile bottom navigation tabs on the home page
            const exploreTab = document.getElementById("mobile-nav-tab-explore");
            if (exploreTab) {
                exploreTab.addEventListener("click", (e) => {
                    e.preventDefault();
                    window.location.href = "maps/";
                });
            }

            const toolsTab = document.getElementById("mobile-nav-tab-tools");
            if (toolsTab) {
                toolsTab.addEventListener("click", (e) => {
                    e.preventDefault();
                    showComingSoonToast("Tools");
                });
            }

            const settingsTab = document.getElementById("mobile-nav-tab-settings");
            if (settingsTab) {
                settingsTab.addEventListener("click", (e) => {
                    e.preventDefault();
                    showComingSoonToast("Settings");
                });
            }

            const homeTab = document.getElementById("mobile-nav-tab-home");
            if (homeTab) {
                homeTab.addEventListener("click", (e) => {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            function initMobileBottomNavAnimation() {
                const nav = document.querySelector(".mobile-bottom-nav");
                if (!nav) return;

                const baseItems = nav.querySelectorAll(".mobile-bottom-nav__base .mobile-bottom-nav-item");
                const capsule = nav.querySelector(".mobile-bottom-nav__capsule");
                const overlay = nav.querySelector(".mobile-bottom-nav__overlay");
                if (!baseItems.length || !capsule || !overlay) return;

                let activeIndex = -1;
                baseItems.forEach((item, index) => {
                    if (item.classList.contains("is-active")) {
                        activeIndex = index;
                    }
                });

                const prevIndexStr = sessionStorage.getItem("prev-nav-index");
                let prevIndex = prevIndexStr !== null ? parseInt(prevIndexStr, 10) : -1;
                sessionStorage.removeItem("prev-nav-index");

                function updateCapsule(targetEl, immediate = false) {
                    if (!targetEl) return;
                    
                    if (immediate) {
                        capsule.style.transition = "none";
                        overlay.style.transition = "none";
                    } else {
                        capsule.style.transition = "transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), width 0.35s cubic-bezier(0.16, 1, 0.3, 1), height 0.35s cubic-bezier(0.16, 1, 0.3, 1)";
                        overlay.style.transition = "clip-path 0.35s cubic-bezier(0.16, 1, 0.3, 1), -webkit-clip-path 0.35s cubic-bezier(0.16, 1, 0.3, 1)";
                    }

                    const navRect = nav.getBoundingClientRect();
                    const targetRect = targetEl.getBoundingClientRect();

                    const left = targetRect.left - navRect.left;
                    const top = targetRect.top - navRect.top;
                    const width = targetRect.width;
                    const height = targetRect.height;

                    capsule.style.transform = `translate(${left}px, ${top}px)`;
                    capsule.style.width = `${width}px`;
                    capsule.style.height = `${height}px`;

                    nav.style.setProperty("--active-x", `${left + width / 2}px`);
                    nav.style.setProperty("--active-y", `${top + height / 2}px`);

                    const clipVal = `inset(${top}px ${navRect.width - (left + width)}px ${navRect.height - (top + height)}px ${left}px round 19px)`;
                    overlay.style.clipPath = clipVal;
                    overlay.style.webkitClipPath = clipVal;

                    if (immediate) {
                        capsule.offsetHeight;
                        capsule.style.transition = "";
                        overlay.style.transition = "";
                    }
                }

                if (prevIndex !== -1 && prevIndex !== activeIndex && baseItems[prevIndex]) {
                    updateCapsule(baseItems[prevIndex], true);
                    requestAnimationFrame(() => {
                        updateCapsule(baseItems[activeIndex]);
                    });
                } else if (activeIndex !== -1) {
                    updateCapsule(baseItems[activeIndex], true);
                }

                // Touch Dragging Logic for the capsule (bound to nav to bypass z-index blocking)
                let isDragging = false;
                let hasMoved = false;
                let startX = 0;
                let initialLeft = 0;
                let currentLeft = 0;

                baseItems.forEach((item, index) => {
                    item.addEventListener("click", (e) => {
                        if (hasMoved) {
                            e.preventDefault();
                            e.stopPropagation();
                            return;
                        }
                        sessionStorage.setItem("prev-nav-index", index);
                        updateCapsule(item);
                    });
                });

                nav.addEventListener("touchstart", (e) => {
                    const touch = e.touches[0];
                    const capsuleRect = capsule.getBoundingClientRect();
                    
                    // Check if touch starts within the bounds of the active capsule
                    if (
                        touch.clientX >= capsuleRect.left &&
                        touch.clientX <= capsuleRect.right &&
                        touch.clientY >= capsuleRect.top &&
                        touch.clientY <= capsuleRect.bottom
                    ) {
                        isDragging = true;
                        hasMoved = false;
                        capsule.style.cursor = "grabbing";
                        startX = touch.clientX;
                        
                        const style = window.getComputedStyle(capsule);
                        const DOMMatrixClass = window.DOMMatrix || window.WebKitCSSMatrix || window.MSCSSMatrix;
                        const matrix = new DOMMatrixClass(style.transform);
                        initialLeft = matrix.m41;
                        currentLeft = initialLeft;

                        capsule.style.transition = "none";
                        overlay.style.transition = "none";
                    }
                }, { passive: true });

                window.addEventListener("touchmove", (e) => {
                    if (!isDragging) return;
                    
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - startX;
                    
                    if (Math.abs(deltaX) > 4) {
                        hasMoved = true;
                    }

                    let newLeft = initialLeft + deltaX;

                    const navRect = nav.getBoundingClientRect();
                    const capsuleRect = capsule.getBoundingClientRect();
                    const paddingLeft = 6;
                    const minLeft = paddingLeft;
                    const maxLeft = navRect.width - paddingLeft - capsuleRect.width;

                    if (newLeft < minLeft) newLeft = minLeft;
                    if (newLeft > maxLeft) newLeft = maxLeft;

                    currentLeft = newLeft;

                    capsule.style.transform = `translate(${newLeft}px, 6px)`;

                    const top = 6;
                    const width = capsuleRect.width;
                    const height = capsuleRect.height;

                    nav.style.setProperty("--active-x", `${newLeft + width / 2}px`);
                    nav.style.setProperty("--active-y", `${top + height / 2}px`);
                    const clipVal = `inset(${top}px ${navRect.width - (newLeft + width)}px ${navRect.height - (top + height)}px ${newLeft}px round 19px)`;
                    overlay.style.clipPath = clipVal;
                    overlay.style.webkitClipPath = clipVal;
                }, { passive: true });

                window.addEventListener("touchend", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    capsule.style.cursor = "grab";

                    capsule.style.transition = "transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), width 0.35s cubic-bezier(0.16, 1, 0.3, 1), height 0.35s cubic-bezier(0.16, 1, 0.3, 1)";
                    overlay.style.transition = "clip-path 0.35s cubic-bezier(0.16, 1, 0.3, 1), -webkit-clip-path 0.35s cubic-bezier(0.16, 1, 0.3, 1)";

                    const navRect = nav.getBoundingClientRect();
                    const capsuleRect = capsule.getBoundingClientRect();
                    const capsuleCenter = currentLeft + capsuleRect.width / 2;

                    let closestItem = null;
                    let closestDist = Infinity;
                    let closestIndex = -1;

                    baseItems.forEach((item, index) => {
                        const itemRect = item.getBoundingClientRect();
                        const itemLeft = itemRect.left - navRect.left;
                        const itemCenter = itemLeft + itemRect.width / 2;
                        const dist = Math.abs(capsuleCenter - itemCenter);
                        
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestItem = item;
                            closestIndex = index;
                        }
                    });

                    if (closestItem) {
                        sessionStorage.setItem("prev-nav-index", closestIndex);
                        
                        const itemRect = closestItem.getBoundingClientRect();
                        const left = itemRect.left - navRect.left;
                        const top = itemRect.top - navRect.top;
                        const width = itemRect.width;
                        const height = itemRect.height;

                        capsule.style.transform = `translate(${left}px, ${top}px)`;
                        capsule.style.width = `${width}px`;
                        capsule.style.height = `${height}px`;

                        nav.style.setProperty("--active-x", `${left + width / 2}px`);
                        nav.style.setProperty("--active-y", `${top + height / 2}px`);

                        const clipVal = `inset(${top}px ${navRect.width - (left + width)}px ${navRect.height - (top + height)}px ${left}px round 19px)`;
                        overlay.style.clipPath = clipVal;
                        overlay.style.webkitClipPath = clipVal;

                        if (hasMoved) {
                            closestItem.click();
                        }
                    }
                    
                    setTimeout(() => {
                        hasMoved = false;
                    }, 50);
                });

                window.addEventListener("resize", () => {
                    const activeTab = nav.querySelector(".mobile-bottom-nav__base .mobile-bottom-nav-item.is-active");
                    if (activeTab) {
                        updateCapsule(activeTab, true);
                    }
                });
            }
            initMobileBottomNavAnimation();

            // Scroll tracking to hide/show the bottom nav capsule
            const bottomNav = document.querySelector(".mobile-bottom-nav");
            
            window.addEventListener("scroll", () => {
                if (window.innerWidth > 768) return;
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > 12) {
                    if (bottomNav) bottomNav.classList.add("is-hidden");
                } else {
                    if (bottomNav) bottomNav.classList.remove("is-hidden");
                }
            }, { passive: true });
        });
    </script>

    <!-- Mobile-only bottom navigation container -->
    <div class="mobile-bottom-nav-container">
        <!-- Main navigation bar (Explore, Tools, Settings) -->
        <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
            <div class="mobile-bottom-nav__capsule"></div>
            <div class="mobile-bottom-nav__base">
                <a id="mobile-nav-tab-explore" class="mobile-bottom-nav-item" href="maps/" aria-label="Explore" title="Explore">
                    <span class="mobile-bottom-nav-item__icon" style="-webkit-mask-image: url('svg/binoculars-1-svgrepo-com.svg'); mask-image: url('svg/binoculars-1-svgrepo-com.svg');"></span>
                </a>
                <a id="mobile-nav-tab-tools" class="mobile-bottom-nav-item" href="maps/#tools" aria-label="Tools" title="Tools">
                    <span class="mobile-bottom-nav-item__icon" style="-webkit-mask-image: url('svg/hammer-tool-svgrepo-com.svg'); mask-image: url('svg/hammer-tool-svgrepo-com.svg');"></span>
                </a>
                <a id="mobile-nav-tab-settings" class="mobile-bottom-nav-item" href="maps/#settings" aria-label="Settings" title="Settings">
                    <span class="mobile-bottom-nav-item__icon" style="-webkit-mask-image: url('svg/settings-svgrepo-com.svg'); mask-image: url('svg/settings-svgrepo-com.svg');"></span>
                </a>
            </div>
            <div class="mobile-bottom-nav__overlay" aria-hidden="true">
                <div class="mobile-bottom-nav-item">
                    <span class="mobile-bottom-nav-item__icon" style="-webkit-mask-image: url('svg/binoculars-1-svgrepo-com.svg'); mask-image: url('svg/binoculars-1-svgrepo-com.svg');"></span>
                </div>
                <div class="mobile-bottom-nav-item">
                    <span class="mobile-bottom-nav-item__icon" style="-webkit-mask-image: url('svg/hammer-tool-svgrepo-com.svg'); mask-image: url('svg/hammer-tool-svgrepo-com.svg');"></span>
                </div>
                <div class="mobile-bottom-nav-item">
                    <span class="mobile-bottom-nav-item__icon" style="-webkit-mask-image: url('svg/settings-svgrepo-com.svg'); mask-image: url('svg/settings-svgrepo-com.svg');"></span>
                </div>
            </div>
        </nav>

        <!-- Standalone Home pill (active on homepage) -->
        <a id="mobile-nav-tab-home" class="mobile-bottom-nav-home is-active" href="#" aria-label="Home" title="Home">
            <span class="mobile-bottom-nav-home__icon" style="-webkit-mask-image: url('svg/home-svgrepo-com.svg'); mask-image: url('svg/home-svgrepo-com.svg');"></span>
        </a>
    </div>
