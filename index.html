<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>fovea</title>
    <meta name="description" content="Fovea - Spatial mapping and count circle data engine. Search and access Christmas Bird Count circles.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.onload=null;this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="icon" type="image/png" href="images/logo-fav.png">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
                "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
            }
        }
    </script>

    <script>
        (function() {
            try {
                const storedTheme = localStorage.getItem("fovea-theme") || "dark";
                const isSystemLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
                if (storedTheme === "light" || (storedTheme === "auto" && isSystemLight)) {
                    document.documentElement.setAttribute("data-theme", "light");
                    document.documentElement.classList.add("theme-light");
                }
            } catch(e) {}
        })();
    </script>

    <style>
        @font-face {
            font-family: 'Aliceregular';
            src: url('fonts/alice-fontfacekit/web%20fonts/alice_regular_macroman/Alice-Regular-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --subtext-color: rgba(255, 255, 255, 0.45);
            --border-color: rgba(255, 255, 255, 0.12);
            --box-bg: rgba(255, 255, 255, 0.05);
            --box-hover-bg: rgba(255, 255, 255, 0.09);

            --accent-color: #64b5f6;
            --accent-light: #91cfff;
            --accent-hover: #79c1f8;
            --accent-rgb: 100, 181, 246;

            --accent-primary: var(--accent-color);
            --accent-green: var(--accent-color);

            --font-serif: 'Aliceregular', 'Alice', Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="light"],
        html.theme-light,
        body.theme-light {
            --bg-color: #ffffff;
            --text-color: #111827;
            --subtext-color: #6b7280;
            --border-color: rgba(0, 0, 0, 0.12);
            --box-bg: #f9fafb;
            --box-hover-bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: clamp(170px, 30vh, 280px); /* Centered vertically by default */
            padding-bottom: clamp(170px, 30vh, 260px);
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            position: relative;
            z-index: 10;
            pointer-events: none;
            transition: padding-top 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .home-birds {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 4s ease;
        }

        .home-birds.is-ready {
            opacity: 0.32;
        }

        [data-theme="light"] .home-birds.is-ready,
        html.theme-light .home-birds.is-ready,
        body.theme-light .home-birds.is-ready {
            opacity: 0.22;
        }

        .home-birds canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (prefers-reduced-motion: reduce) {
            .home-birds,
            .home-birds.is-ready {
                display: none;
                transition: none;
            }
        }

        .home-container.search-active {
            padding-top: clamp(80px, 13vh, 140px); /* Shifts upwards to make room for suggestions dropdown */
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(300px, 50vw, 600px);
            height: clamp(300px, 50vw, 600px);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Logo Title & Dataset Dropdown Wrapper */
        .logo-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-end;
            margin-bottom: 1.6rem;
            user-select: none;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInLogo 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
            pointer-events: auto;
            z-index: 50; /* Stacking context above search-wrapper (z-index: 20) */
        }

        .logo-wrapper.is-open {
            z-index: 1000 !important; /* Floats popup above search bar and other UI */
        }

        .logo-title {
            font-family: var(--font-serif);
            font-size: clamp(4.5rem, 11vw, 8.5rem);
            font-weight: 400;
            color: var(--text-color);
            text-transform: lowercase;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 0;
            text-align: center;
        }

        /* Dataset Selector Dropdown (Right-aligned below fovea logo) */
        .dataset-dropdown-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            margin-top: -0.85rem;
            margin-right: -0.85rem;
            z-index: 100;
        }

        .dataset-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.1rem 0.3rem;
            background: transparent;
            border: none;
            outline: none;
            border-radius: 6px;
            color: var(--accent-color);
            font-family: var(--font-sans);
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            cursor: pointer;
            line-height: 1;
            white-space: nowrap;
            transition: all 0.2s ease;
            user-select: none;
        }

        .dataset-toggle-btn:hover {
            color: var(--accent-light, #91cfff);
            background: rgba(var(--accent-rgb, 100, 181, 246), 0.1);
        }

        .dataset-toggle-chevron {
            width: 11px;
            height: 11px;
            stroke: var(--accent-color);
            stroke-width: 2.5;
            transition: transform 0.2s ease, stroke 0.2s ease;
            flex-shrink: 0;
        }

        .dataset-toggle-btn:hover .dataset-toggle-chevron {
            stroke: var(--accent-light, #91cfff);
        }

        .dataset-toggle-btn[aria-expanded="true"] .dataset-toggle-chevron {
            transform: rotate(180deg);
        }

        /* Floating Options Dropdown Popup Menu (Matching Settings Page) */
        .dataset-select-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0 !important;
            left: auto !important;
            z-index: 99999 !important;
            min-width: 215px;
            background: #000000 !important;
            border: 1px solid #333333 !important;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95), 0 4px 16px rgba(0, 0, 0, 0.8) !important;
            border-radius: 12px !important;
            padding: 0.35rem !important;
            display: none;
            flex-direction: column;
            gap: 0.15rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .dataset-select-menu[aria-hidden="false"] {
            display: flex !important;
            animation: datasetMenuFadeIn 0.15s cubic-bezier(0, 0, 0.2, 1) forwards;
        }

        @keyframes datasetMenuFadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dataset-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            color: #e4e4e7 !important;
            font-family: var(--font-sans);
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            gap: 1rem;
        }

        .dataset-menu-item__left {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            min-width: 0;
        }

        .dataset-menu-item:hover:not(.is-disabled) {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff !important;
        }

        .dataset-menu-item.is-active {
            color: var(--accent-color) !important;
            font-weight: 600;
        }

        .dataset-menu-item.is-active .dataset-menu-item__icon,
        .dataset-menu-item.is-active .dataset-menu-item__check {
            stroke: var(--accent-color);
        }

        .dataset-menu-item__icon {
            width: 14px;
            height: 14px;
            stroke: #a1a1aa;
            stroke-width: 2.2;
            flex-shrink: 0;
            transition: stroke 0.2s ease;
        }

        .dataset-menu-item:hover:not(.is-disabled) .dataset-menu-item__icon {
            stroke: #ffffff;
        }

        .dataset-menu-item__check {
            stroke: var(--accent-color);
            stroke-width: 2.5;
            flex-shrink: 0;
        }

        .dataset-menu-item.is-disabled {
            opacity: 0.5;
            cursor: default;
        }

        .dataset-menu-item__badge {
            font-size: 0.72rem;
            font-weight: 500;
            padding: 0.15rem 0.45rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.02em;
            margin-left: 0.25rem;
            white-space: nowrap;
        }

        @keyframes fadeInLogo {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search Form Wrapper */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            z-index: 20;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.25s;
            pointer-events: auto; /* Restore interactivity for search and autocomplete dropdown */
        }

        @keyframes fadeInSearch {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #000000 !important;
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.75rem 1.25rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative; /* Relative positioning for glow pseudo-elements */
            overflow: visible; /* Allows outline highlight to extend slightly outside bounds */
        }

        /* Proximity Border Highlight Outline for Search Box */
        .search-box::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 10000px;
            padding: 1px;
            background: radial-gradient(
                var(--spotlight-size, 240px) circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                transparent 75%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 1;
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.09) !important;
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .search-icon {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .search-box:focus-within .search-icon {
            color: rgba(255, 255, 255, 0.8);
        }

        .search-input {
            position: relative;
            z-index: 2;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: var(--font-sans);
            font-weight: 400;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .search-clear {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .search-clear:hover {
            color: #ffffff;
        }

        /* Home Shortcut Below Search */
        .home-shortcuts {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.25rem;
            z-index: 10;
            position: relative;
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.35s;
            opacity: 0;
            pointer-events: auto;
        }

        .home-shortcut-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 9999px;
            color: rgba(255, 255, 255, 0.75);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .home-shortcut-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .home-shortcut-btn svg {
            color: var(--accent-color, #64b5f6);
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .home-shortcut-btn:hover svg {
            transform: translateY(1px);
        }

        [data-theme="light"] .home-shortcut-btn,
        html.theme-light .home-shortcut-btn,
        body.theme-light .home-shortcut-btn {
            background: rgba(0, 0, 0, 0.04);
            border: none;
            color: #374151;
        }

        [data-theme="light"] .home-shortcut-btn:hover,
        html.theme-light .home-shortcut-btn:hover,
        body.theme-light .home-shortcut-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #111827;
        }

        /* Autocomplete Dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #000000 !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
            z-index: 50;
            padding: 0.4rem;
            display: none;
            overflow: visible !important;
            --mouse-x: 50%;
            --mouse-y: 50%;
            --glow-opacity: 0;
            --spotlight-size: 240px;
        }

        .autocomplete-scroll-container {
            max-height: 272px;
            overflow-y: auto;
            border-radius: 12px;
            position: relative;
            z-index: 2;
        }

        /* Proximity Glow for Autocomplete Dropdown */
        .autocomplete-dropdown::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 0;
            background: radial-gradient(
                var(--spotlight-size) circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.04) 0%,
                rgba(255, 255, 255, 0.01) 50%,
                transparent 75%
            );
        }

        .autocomplete-dropdown::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 17px;
            padding: 1px;
            background: radial-gradient(
                var(--spotlight-size) circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                transparent 75%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 1;
        }

        .autocomplete-item {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
            text-decoration: none;
            color: inherit;
        }

        .autocomplete-item:hover,
        .autocomplete-item.is-selected {
            background: rgba(255, 255, 255, 0.10);
        }

        .autocomplete-item__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: #000000;
            border-radius: 6px;
            padding: 3px;
            box-sizing: border-box;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .autocomplete-item:hover .autocomplete-item__icon {
            color: var(--accent-green);
        }

        .autocomplete-item__info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .autocomplete-item__title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .autocomplete-item__subtitle {
            font-size: 0.76rem;
            color: var(--subtext-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .no-results {
            padding: 1rem;
            text-align: center;
            font-size: 0.84rem;
            color: var(--subtext-color);
        }
        /* Top Right Controls (About Info) */
        .top-right-controls {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            z-index: 500;
            pointer-events: auto;
            opacity: 0;
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        .settings-btn,
        .info-btn {
            background: none;
            border: none;
            padding: 8px;
            margin: 0;
            cursor: pointer;
            color: var(--subtext-color);
            transition: color 0.25s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: relative;
            z-index: 501;
            pointer-events: auto;
            border-radius: 50%;
        }

        .settings-btn:hover {
            color: #ffffff;
            transform: rotate(45deg);
        }

        .info-btn:hover {
            color: #ffffff;
            transform: scale(1.1);
        }


        /* Toast Popup Notification */
        .toast-notification {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 33, 40, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 0.75rem 1.4rem;
            border-radius: 9999px;
            font-size: 0.86rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.65rem;
            white-space: nowrap;
        }

        .toast-notification.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Fade Overlay for transition */
        .fade-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1.0s cubic-bezier(0.76, 0, 0.24, 1);
        }
        .fade-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Corner Navigation Text Buttons (About & Tools as Full-Height viewport slivers) */
        .corner-nav-btn {
            position: fixed;
            top: 5rem;
            bottom: 0;
            width: 100px;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--subtext-color);
            text-decoration: none;
            z-index: 100;
            user-select: none;
            pointer-events: auto;
            display: flex;
            align-items: flex-end;
            padding-bottom: 2.2rem;
            transition: color 0.25s ease;
        }

        /* Side frame panel that slides in/out from the viewport edge */
        .corner-nav-btn::before {
            content: '';
            position: absolute;
            top: calc(50% - 2.5rem);
            height: 70vh; /* Floating edge panel height */
            width: 100px;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            background: #0f0f0f; /* Same premium grey as the top frame on maps page */
            z-index: -1;
        }

        .corner-nav-btn span {
            display: inline-block;
            transition: transform 0.25s ease;
            position: relative;
            z-index: 2;

        .corner-nav-left {
            left: 0;
            padding-left: 1.5rem;
            justify-content: flex-start;

            left: 0;
            transform: translateY(-50%) translateX(-100%);
            border-radius: 0 36px 36px 0;
        }

        .corner-nav-left:hover {
            color: #ffffff;
        }

        .corner-nav-left:hover::before {
            transform: translateY(-50%) translateX(0);
            opacity: 1;
        }

        .corner-nav-left:hover span {
            transform: translateX(-4px);

        .corner-nav-right {

            padding-right: 1.5rem;

            transform: translateY(-50%) translateX(100%);

        .corner-arrow-circle {

            top: calc(50% - 2.5rem);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #72767d; /* Solid grey to prevent transparency overlap artifacts */
            transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        color 0.25s ease,
                        left 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        right 0.55s cubic-bezier(0.16, 1, 0.3, 1);

        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("home-search-input");
            const clearBtn = document.getElementById("home-search-clear");
            const dropdown = document.getElementById("home-autocomplete");
            const homeContainer = document.querySelector(".home-container");
            let selectedIndex = -1;

            // Start the decorative simulation only after the homepage has had time to render.
            if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                const startHomeBirds = () => {
                    const container = document.getElementById("home-birds");
                    const startFallback = () => import("./scripts/home-birds-fallback.js")
                        .then(({ mountFallbackBirds }) => mountFallbackBirds(container))
                        .catch(() => {});
                    if (!navigator.gpu) {
                        startFallback();
                        return;
                    }
                    import("./scripts/home-birds.js")
                        .then(({ mountHomeBirds }) => mountHomeBirds(container))
                        .then(isMounted => { if (!isMounted) startFallback(); })
                        .catch(startFallback);
                };
                if ("requestIdleCallback" in window) {
                    window.requestIdleCallback(startHomeBirds, { timeout: 2400 });
                } else {
                    window.setTimeout(startHomeBirds, 1400);
                }
            }

            // Proximity Glow Effect for Search Box & Autocomplete Dropdown
            const setupProximityGlow = (element, threshold = 140, spotlightSize = 240) => {
                if (!element) return;
                
                element.style.setProperty("--mouse-x", "50%");
                element.style.setProperty("--mouse-y", "50%");
                element.style.setProperty("--glow-opacity", "0");
                element.style.setProperty("--spotlight-size", `${spotlightSize}px`);

                window.addEventListener("mousemove", (e) => {
                    if (window.getComputedStyle(element).display === "none") {
                        element.style.setProperty("--glow-opacity", "0");
                        return;
                    }

                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
                    const dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    element.style.setProperty("--mouse-x", `${x}px`);
                    element.style.setProperty("--mouse-y", `${y}px`);

                    let opacity = 0;
                    if (dist <= threshold) {
                        opacity = Math.pow(1 - dist / threshold, 1.2);
                    }

                    element.style.setProperty("--glow-opacity", opacity.toFixed(3));
                });
            };

            setupProximityGlow(dropdown, 140, 240);
            
            const searchBox = document.querySelector(".search-box");
            setupProximityGlow(searchBox, 140, 240);

            // Dataset selector dropdown (Audubon CBC / Add New)
            const datasetToggleBtn = document.getElementById("dataset-toggle-btn");
            const datasetMenu = document.getElementById("dataset-menu");
            if (datasetToggleBtn && datasetMenu) {
                let isDatasetMenuOpen = false;
                const logoWrap = document.querySelector(".logo-wrapper");

                function openDatasetMenu() {
                    isDatasetMenuOpen = true;
                    if (dropdown) dropdown.style.display = "none";
                    datasetMenu.setAttribute("aria-hidden", "false");
                    datasetToggleBtn.setAttribute("aria-expanded", "true");
                    if (logoWrap) logoWrap.classList.add("is-open");
                }

                function closeDatasetMenu() {
                    isDatasetMenuOpen = false;
                    datasetMenu.setAttribute("aria-hidden", "true");
                    datasetToggleBtn.setAttribute("aria-expanded", "false");
                    if (logoWrap) logoWrap.classList.remove("is-open");
                }

                datasetToggleBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (isDatasetMenuOpen) {
                        closeDatasetMenu();
                    } else {
                        openDatasetMenu();
                    }
                });

                const datasetItems = datasetMenu.querySelectorAll(".dataset-menu-item");
                datasetItems.forEach(item => {
                    item.addEventListener("click", (e) => {
                        e.stopPropagation();
                        if (item.classList.contains("is-disabled")) {
                            return;
                        }
                        datasetItems.forEach(i => {
                            i.classList.remove("is-active");
                            const check = i.querySelector(".dataset-menu-item__check");
                            if (check) check.style.display = "none";
                        });
                        item.classList.add("is-active");
                        const check = item.querySelector(".dataset-menu-item__check");
                        if (check) check.style.display = "block";

                        const label = item.querySelector(".dataset-menu-item__left span");
                        const toggleLabel = document.querySelector(".dataset-toggle-label");
                        if (label && toggleLabel) {
                            toggleLabel.textContent = label.textContent;
                        }

                        closeDatasetMenu();
                    });
                });

                document.addEventListener("click", (e) => {
                    if (isDatasetMenuOpen && !e.target.closest(".dataset-dropdown-wrapper")) {
                        closeDatasetMenu();
                    }
                });

                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape" && isDatasetMenuOpen) {
                        closeDatasetMenu();
                    }
                });
            }

            const renderDropdown = (query) => {
                const q = query.trim().toLowerCase();
                

                if (!q) {
                    dropdown.style.display = "none";
                    dropdown.innerHTML = "";
                    clearBtn.style.display = "none";
                    selectedIndex = -1;
                    if (homeContainer) {
                        homeContainer.classList.remove("search-active");
                    }
                    return;
                }

                clearBtn.style.display = "flex";
                if (homeContainer) {
                    homeContainer.classList.add("search-active");
                }

                const matches = COUNT_CIRCLES_DATA.filter(circle => 
                    circle.name.toLowerCase().includes(q) ||
                    circle.title.toLowerCase().includes(q) ||
                    circle.subtitle.toLowerCase().includes(q)
                );


                if (matches.length === 0) {
                    dropdown.style.display = "block";
                    dropdown.innerHTML = `<div class="autocomplete-scroll-container"><div class="no-results">No count circle matching "${q}"</div></div>`;
                    selectedIndex = -1;
                    return;
                }

                dropdown.style.display = "block";
                const itemsHtml = matches.map((circle, index) => {
                    let iconHtml = "";
                    if (circle.hasData) {
                        iconHtml = `<img src="${circle.logo}" alt="${circle.name}" style="width: 100%; height: 100%; object-fit: contain;" />`;
                    } else {
                        iconHtml = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; opacity: 0.5;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                            </svg>
                        `;
                    }
                    return `
                        <a href="${circle.url}" class="autocomplete-item" data-index="${index}">
                            <div class="autocomplete-item__icon">
                                ${iconHtml}
                            </div>
                            <div class="autocomplete-item__info">
                                <div class="autocomplete-item__title">${circle.title}</div>
                                <div class="autocomplete-item__subtitle">${circle.subtitle}</div>
                            </div>
                        </a>
                    `;
                }).join("");

                dropdown.innerHTML = `<div class="autocomplete-scroll-container">${itemsHtml}</div>`;
                selectedIndex = -1;
            };

            input.addEventListener("input", (e) => {
                renderDropdown(e.target.value);
            });

            input.addEventListener("focus", (e) => {
                if (typeof closeDatasetMenu === "function") closeDatasetMenu();
                if (e.target.value.trim()) {
                    renderDropdown(e.target.value);
                }
            });

            clearBtn.addEventListener("click", () => {
                input.value = "";
                renderDropdown("");
                input.focus();
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".search-wrapper")) {
                    dropdown.style.display = "none";
                            if (homeContainer) {
                        homeContainer.classList.remove("search-active");
                    }
                }
            });

            // Keyboard Navigation (Arrow keys + Enter)
            input.addEventListener("keydown", (e) => {
                const items = dropdown.querySelectorAll(".autocomplete-item");
                if (items.length === 0) return;

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    selectedIndex = (selectedIndex + 1) % items.length;
                    highlightItem(items);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    highlightItem(items);
                } else if (e.key === "Enter") {
                    if (selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        items[selectedIndex].click();
                    } else if (items.length > 0) {
                        e.preventDefault();
                        items[0].click();
                    }
                }
            });

            function highlightItem(items) {
                items.forEach((item, index) => {
                    if (index === selectedIndex) {
                        item.classList.add("is-selected");
                        item.scrollIntoView({ block: "nearest" });
                    } else {
                        item.classList.remove("is-selected");
                    }
                });
            }

            let toastTimer = null;
            function showComingSoonToast(featureName) {
                const toast = document.getElementById("toast-notification");
                if (!toast) return;
                toast.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: #00d5a4;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span><strong>${featureName}</strong> will be available soon</span>
                `;
                toast.classList.add("is-visible");
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove("is-visible");
                }, 2800);
            }

            document.querySelectorAll("[data-coming-soon]").forEach(el => {
                // Skip corner buttons which use advanced page transitions
                if (el.classList.contains("corner-nav-btn")) return;

                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const name = el.getAttribute("data-coming-soon");
                    showComingSoonToast(name);
                });
            });

            // Bind click listener for settings button
            const settingsBtn = document.querySelector(".settings-btn");
            if (settingsBtn) {
                settingsBtn.addEventListener("click", () => {
                    window.location.href = "settings/";
                });
            }

            const infoBtn = document.querySelector(".info-btn");
            if (infoBtn) infoBtn.addEventListener("click", event => event.stopPropagation());

            const overlay = document.querySelector(".fade-overlay");
            const settingsNavBtn = document.querySelector(".corner-nav-right");
            const toolsNavBtn = document.querySelector(".corner-nav-left");
            [[settingsNavBtn, "is-transitioning-right"], [toolsNavBtn, "is-transitioning-left"]]
                .forEach(([button, transitionClass]) => {
                    if (!button) return;
                    button.addEventListener("click", event => {
                        if (event.target.closest(".top-right-controls, .info-btn")) return;
                        event.preventDefault();
                        if (document.body.className.includes("is-transitioning-")) return;
                        document.body.classList.add(transitionClass);
                        if (overlay) overlay.classList.add("is-active");
                        setTimeout(() => { window.location.href = button.getAttribute("href"); }, 800);
                    });
                });

            const backHomeBtn = document.getElementById("back-home-btn");
            if (backHomeBtn) {
                backHomeBtn.addEventListener("click", event => {
                    event.preventDefault();
                    event.stopPropagation();
                    const screen = document.getElementById("tools-coming-soon-screen");
                    if (screen) screen.classList.remove("is-active");
                    setTimeout(() => {
                        document.body.classList.remove("is-transitioning-left");
                        if (overlay) overlay.classList.remove("is-active");
                    }, 300);
                });
            }

        });

        window.addEventListener("pageshow", () => {
            document.body.classList.remove("is-transitioning-left", "is-transitioning-right");
            const overlay = document.querySelector(".fade-overlay");
            if (overlay) overlay.classList.remove("is-active");
        });
    </script>

    <!-- Full-Screen Tools Coming Soon Panel Overlay -->
    <div id="tools-coming-soon-screen" class="coming-soon-screen">
        <h2 class="coming-soon-title">Tools</h2>
        <p class="coming-soon-text">Fovea spatial analytics and dataset management tools are under active development.</p>
        <button type="button" id="back-home-btn" class="coming-soon-btn">Back to Home</button>
    </div>

    <script defer src="scripts/mobile-bottom-nav.js?v=1" data-active-page="home" data-root="./"></script>
</body>
</html>
