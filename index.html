<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>fovea</title>
    <meta name="description" content="Fovea - Spatial mapping and count circle data engine. Search and access Christmas Bird Count circles.">

    <!-- Fonts & Icons -->
    <link rel="icon" type="image/png" href="images/logo-fav.png">

    <!-- MapLibre GL -->
    <link href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>

    <style>
        @font-face {
            font-family: 'Aliceregular';
            src: url('fonts/alice-fontfacekit/web%20fonts/alice_regular_macroman/Alice-Regular-webfont.woff2') format('woff2'),
                 url('fonts/alice-fontfacekit/web%20fonts/alice_regular_macroman/Alice-Regular-webfont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --subtext-color: rgba(255, 255, 255, 0.45);
            --border-color: rgba(255, 255, 255, 0.12);
            --box-bg: rgba(255, 255, 255, 0.05);
            --box-hover-bg: rgba(255, 255, 255, 0.09);

            --accent-color: #64b5f6;
            --accent-light: #91cfff;
            --accent-hover: #79c1f8;
            --accent-rgb: 100, 181, 246;

            --accent-primary: var(--accent-color);
            --accent-green: var(--accent-color);

            --font-serif: 'Aliceregular', 'Alice', Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem clamp(170px, 30vh, 260px) 1.5rem;
            position: relative;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through empty spaces to globe container underneath */
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(300px, 50vw, 600px);
            height: clamp(300px, 50vw, 600px);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Logo Title */
        .logo-title {
            font-family: var(--font-serif);
            font-size: clamp(4.5rem, 11vw, 8.5rem);
            font-weight: 400;
            color: var(--text-color);
            text-transform: lowercase;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 2.25rem;
            user-select: none;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInLogo 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
            pointer-events: auto; /* Restore interactivity */
        }

        @keyframes fadeInLogo {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search Form Wrapper */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            z-index: 20;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.25s;
            pointer-events: auto; /* Restore interactivity for search and autocomplete dropdown */
        }

        @keyframes fadeInSearch {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #000000 !important;
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.75rem 1.25rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.09) !important;
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .search-icon {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .search-box:focus-within .search-icon {
            color: rgba(255, 255, 255, 0.8);
        }

        .search-input {
            position: relative;
            z-index: 2;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: var(--font-sans);
            font-weight: 400;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .search-clear {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .search-clear:hover {
            color: #ffffff;
        }

        /* Globe Interactive Markers */
        .marker-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: none; /* No glow */
            transition: background-color 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        /* Hover/Keyboard highlight status colors */
        .marker-dot.is-active {
            background-color: var(--accent-color, #00d5a4);
            box-shadow: none; /* No glow */
            transform: scale(1.3);
        }

        /* Autocomplete Dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #000000 !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
            z-index: 50;
            padding: 0.4rem;
            display: none;
            overflow: visible !important;
            --mouse-x: 50%;
            --mouse-y: 50%;
            --glow-opacity: 0;
            --spotlight-size: 240px;
        }

        .autocomplete-scroll-container {
            max-height: 272px;
            overflow-y: auto;
            border-radius: 12px;
            position: relative;
            z-index: 2;
        }

        /* Proximity Glow for Autocomplete Dropdown */
        .autocomplete-dropdown::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 0;
            background: radial-gradient(
                var(--spotlight-size) circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.04) 0%,
                rgba(255, 255, 255, 0.01) 50%,
                transparent 75%
            );
        }

        .autocomplete-dropdown::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 17px;
            padding: 1px;
            background: radial-gradient(
                var(--spotlight-size) circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                transparent 75%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 1;
        }

        .autocomplete-item {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
            text-decoration: none;
            color: inherit;
        }

        .autocomplete-item:hover,
        .autocomplete-item.is-selected {
            background: rgba(255, 255, 255, 0.10);
        }

        .autocomplete-item__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .autocomplete-item:hover .autocomplete-item__icon {
            color: var(--accent-green);
        }

        .autocomplete-item__info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .autocomplete-item__title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .autocomplete-item__subtitle {
            font-size: 0.76rem;
            color: var(--subtext-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .no-results {
            padding: 1rem;
            text-align: center;
            font-size: 0.84rem;
            color: var(--subtext-color);
        }

        /* Bottom Quick Links Footer */
        .home-footer {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            opacity: 0;
            animation: fadeInSearch 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
            pointer-events: auto; /* Restore interactivity for links */
        }

        .footer-link {
            font-size: 0.82rem;
            color: var(--subtext-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #ffffff;
        }

        /* Toast Popup Notification */
        .toast-notification {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 33, 40, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 0.75rem 1.4rem;
            border-radius: 9999px;
            font-size: 0.86rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.65rem;
            white-space: nowrap;
        }

        .toast-notification.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Fade Overlay for transition */
        .fade-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1.0s cubic-bezier(0.76, 0, 0.24, 1);
        }
        .fade-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Globe Container (positioned at the bottom to show upper half) */
        .globe-container {
            position: fixed;
            left: 50%;
            bottom: -215px; /* Half of 430px base width */
            transform: translateX(-50%) translateY(0) scale(1.2); /* Scale to 1.2 for 516px on-screen diameter */
            width: 430px;
            height: 430px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5; /* Lowered z-index so autocomplete dropdown sits on top */
            background: #000000;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transform-origin: center bottom; /* Scales upwards from screen bottom boundary */
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .globe-container:hover {
            transform: translateX(-50%) translateY(-25px) scale(1.26);
            box-shadow: 0 -8px 50px rgba(0, 0, 0, 0.95), 0 0 35px rgba(var(--accent-rgb), 0.22);
        }

        /* Proximity Border Glow/Highlight Outline for Circular Earth Globe */
        .globe-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 0.75px;
            background: radial-gradient(
                var(--spotlight-size, 300px) circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.38) 0%,
                rgba(255, 255, 255, 0.12) 40%,
                transparent 75%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.1s linear;
            z-index: 10;
        }



        .globe-container.is-flying {
            transform: translateX(-50%) translateY(-120vh) scale(1.2) !important; /* Keep scale constant at desktop 1.2 */
            transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1) !important;
            pointer-events: none;
        }

        .home-globe-map {
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        
        .home-globe-map.is-loaded {
            opacity: 1;
        }

        /* Globe Loading Shimmer Overlay */
        .globe-overlay-shimmer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.4) 100%);
            transition: opacity 0.8s ease;
            pointer-events: none;
            z-index: 6;
        }
        
        .globe-overlay-shimmer::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.04),
                transparent
            );
            transform: translateX(-100%);
            animation: globe-shimmer 2.0s infinite;
        }
        
        @keyframes globe-shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .globe-container.loaded .globe-overlay-shimmer {
            opacity: 0;
        }

        /* Responsive scaling and spacing for the globe container & home container */
        @media (max-width: 768px) {
            .home-container {
                padding-bottom: 170px !important;
            }
            .globe-container {
                bottom: -150px !important;
                width: 300px !important;
                height: 300px !important;
                transform: translateX(-50%) translateY(0) scale(1.1) !important;
            }
            .globe-container:hover {
                transform: translateX(-50%) translateY(-15px) scale(1.16) !important;
            }
            .globe-container.is-flying {
                transform: translateX(-50%) translateY(-120vh) scale(1.1) !important; /* Keep scale constant at mobile 1.1 */
            }
        }
    </style>
    <link rel="stylesheet" href="styles/mobile-bottom-nav.css?v=16">
</head>

<body>
    <div class="fade-overlay is-active"></div>
    <div class="ambient-glow"></div>
    <div id="toast-notification" class="toast-notification"></div>

    <main class="home-container">
        <h1 class="logo-title">fovea</h1>

        <div class="search-wrapper">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="home-search-input" class="search-input" placeholder="Search count circles (e.g. Eugene, Florence)..." autocomplete="off" spellcheck="false" />
                <button type="button" id="home-search-clear" class="search-clear" aria-label="Clear search" style="display: none;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="home-autocomplete" class="autocomplete-dropdown"></div>
        </div>

        <nav class="home-footer">
            <a href="maps/" class="footer-link">Interactive Map</a>
            <a href="info/" class="footer-link">Information</a>
            <a href="#" class="footer-link" data-coming-soon="Results Data">Results Data</a>
            <a href="#" class="footer-link" data-coming-soon="Directory">Directory</a>
        </nav>
    </main>

    <!-- Globe Portal Container -->
    <div id="globe-portal-container" class="globe-container is-flying">
        <div id="home-globe" class="home-globe-map"></div>
        <div class="globe-overlay-shimmer"></div>
    </div>

    <script>
        const COUNT_CIRCLES_DATA = [
            {
                name: "Eugene",
                title: "Eugene Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Eugene",
                logo: "images/logo-small.png",
                hasData: true,
                coords: [-123.079, 44.052]
            },
            {
                name: "Florence",
                title: "Florence Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Florence",
                logo: "images/florence.png",
                hasData: true,
                coords: [-124.08, 44.01]
            },
            {
                name: "Cottage Grove",
                title: "Cottage Grove Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Cottage%20Grove",
                hasData: false,
                coords: [-122.99, 43.77]
            },
            {
                name: "Oakridge",
                title: "Oakridge Count Circle",
                subtitle: "Lane County, OR, USA",
                url: "maps/?circle=Oakridge",
                hasData: false,
                coords: [-122.46, 43.74]
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("home-search-input");
            const clearBtn = document.getElementById("home-search-clear");
            const dropdown = document.getElementById("home-autocomplete");
            let selectedIndex = -1;
            let currentMatches = [];
            let homeMap = null;
            let rotationId = null;
            let isSpinning = true;

            // Updates the WebGL circle markers GeoJSON data inside homeMap
            function updateMapMarkers(matches, hoveredIndex = -1) {
                try {
                    if (!homeMap) return;
                    const source = homeMap.getSource('search-markers');
                    if (!source) return;

                    const features = matches.map((circle, index) => ({
                        type: 'Feature',
                        properties: {
                            name: circle.name,
                            active: (index === hoveredIndex)
                        },
                        geometry: {
                            type: 'Point',
                            coordinates: circle.coords
                        }
                    }));

                    source.setData({
                        type: 'FeatureCollection',
                        features: features
                    });
                } catch (e) {
                    console.warn("updateMapMarkers error:", e);
                }
            }

            // Proximity Glow Effect for Search Box & Autocomplete Dropdown
            const setupProximityGlow = (element, threshold = 140, spotlightSize = 240) => {
                if (!element) return;
                
                element.style.setProperty("--mouse-x", "50%");
                element.style.setProperty("--mouse-y", "50%");
                element.style.setProperty("--glow-opacity", "0");
                element.style.setProperty("--spotlight-size", `${spotlightSize}px`);

                window.addEventListener("mousemove", (e) => {
                    if (window.getComputedStyle(element).display === "none") {
                        element.style.setProperty("--glow-opacity", "0");
                        return;
                    }

                    const rect = element.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
                    const dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    element.style.setProperty("--mouse-x", `${x}px`);
                    element.style.setProperty("--mouse-y", `${y}px`);

                    let opacity = 0;
                    if (dist <= threshold) {
                        opacity = Math.pow(1 - dist / threshold, 1.2);
                    }

                    element.style.setProperty("--glow-opacity", opacity.toFixed(3));
                });
            };

            setupProximityGlow(dropdown, 140, 240);

            const renderDropdown = (query) => {
                const q = query.trim().toLowerCase();
                
                currentMatches = [];
                updateMapMarkers([]);

                if (!q) {
                    dropdown.style.display = "none";
                    dropdown.innerHTML = "";
                    clearBtn.style.display = "none";
                    selectedIndex = -1;

                    // Restore automatic horizontal rotation centered at the Equator (0)
                    isSpinning = true;
                    try {
                        if (homeMap) {
                            homeMap.easeTo({
                                center: [-123.079, 0],
                                duration: 2200,
                                easing: (t) => 1 - Math.pow(1 - t, 4)
                            });
                        }
                    } catch (e) {
                        // Suppress map state errors if map is not fully loaded yet
                    }
                    rotateGlobe();
                    return;
                }

                clearBtn.style.display = "flex";

                const matches = COUNT_CIRCLES_DATA.filter(circle => 
                    circle.name.toLowerCase().includes(q) ||
                    circle.title.toLowerCase().includes(q) ||
                    circle.subtitle.toLowerCase().includes(q)
                );

                currentMatches = matches;

                if (matches.length === 0) {
                    dropdown.style.display = "block";
                    dropdown.innerHTML = `<div class="autocomplete-scroll-container"><div class="no-results">No count circle matching "${q}"</div></div>`;
                    selectedIndex = -1;
                    return;
                }

                dropdown.style.display = "block";
                const itemsHtml = matches.map((circle, index) => {
                    let iconHtml = "";
                    if (circle.hasData) {
                        iconHtml = `<img src="${circle.logo}" alt="${circle.name}" style="width: 100%; height: 100%; object-fit: contain;" />`;
                    } else {
                        iconHtml = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; opacity: 0.5;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                            </svg>
                        `;
                    }
                    return `
                        <a href="${circle.url}" class="autocomplete-item" data-index="${index}">
                            <div class="autocomplete-item__icon">
                                ${iconHtml}
                            </div>
                            <div class="autocomplete-item__info">
                                <div class="autocomplete-item__title">${circle.title}</div>
                                <div class="autocomplete-item__subtitle">${circle.subtitle}</div>
                            </div>
                        </a>
                    `;
                }).join("");

                dropdown.innerHTML = `<div class="autocomplete-scroll-container">${itemsHtml}</div>`;
                selectedIndex = -1;

                // Stop auto-rotation while viewing search results
                isSpinning = false;
                if (rotationId) cancelAnimationFrame(rotationId);

                // Add interactive MapLibre WebGL marker dots for suggested circles
                updateMapMarkers(matches);

                // Move map camera to focus on suggested markers (average centroid position, no zoom change)
                if (matches.length > 0 && homeMap) {
                    const avgLng = matches.reduce((sum, c) => sum + c.coords[0], 0) / matches.length;
                    const avgLat = matches.reduce((sum, c) => sum + c.coords[1], 0) / matches.length;
                    try {
                        homeMap.easeTo({
                            center: [avgLng, avgLat],
                            duration: 2200,
                            easing: (t) => 1 - Math.pow(1 - t, 4)
                        });
                    } catch (e) {
                        // Suppress map state errors
                    }
                }

                // Bind hover events to suggestion list links to update WebGL highlights
                setTimeout(() => {
                    const items = dropdown.querySelectorAll(".autocomplete-item");
                    items.forEach(item => {
                        const idx = parseInt(item.getAttribute("data-index"));
                        item.addEventListener("mouseenter", () => {
                            updateMapMarkers(matches, idx);
                        });
                        item.addEventListener("mouseleave", () => {
                            updateMapMarkers(matches, -1);
                        });
                    });
                }, 0);
            };

            input.addEventListener("input", (e) => {
                renderDropdown(e.target.value);
            });

            input.addEventListener("focus", (e) => {
                if (e.target.value.trim()) {
                    renderDropdown(e.target.value);
                }
            });

            clearBtn.addEventListener("click", () => {
                input.value = "";
                renderDropdown("");
                input.focus();
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".search-wrapper")) {
                    dropdown.style.display = "none";
                    currentMatches = [];
                    updateMapMarkers([]);
                    // Restore spinning centered at the Equator (0)
                    isSpinning = true;
                    try {
                        if (homeMap) {
                            homeMap.easeTo({
                                center: [-123.079, 0],
                                duration: 2200,
                                easing: (t) => 1 - Math.pow(1 - t, 4)
                            });
                        }
                    } catch (err) {}
                    rotateGlobe();
                }
            });

            // Keyboard Navigation (Arrow keys + Enter)
            input.addEventListener("keydown", (e) => {
                const items = dropdown.querySelectorAll(".autocomplete-item");
                if (items.length === 0) return;

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    selectedIndex = (selectedIndex + 1) % items.length;
                    highlightItem(items);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    highlightItem(items);
                } else if (e.key === "Enter") {
                    if (selectedIndex >= 0 && selectedIndex < items.length) {
                        e.preventDefault();
                        items[selectedIndex].click();
                    } else if (items.length > 0) {
                        e.preventDefault();
                        items[0].click();
                    }
                }
            });

            function highlightItem(items) {
                items.forEach((item, index) => {
                    if (index === selectedIndex) {
                        item.classList.add("is-selected");
                        item.scrollIntoView({ block: "nearest" });
                    } else {
                        item.classList.remove("is-selected");
                    }
                });
                updateMapMarkers(currentMatches, selectedIndex);
            }

            let toastTimer = null;
            function showComingSoonToast(featureName) {
                const toast = document.getElementById("toast-notification");
                if (!toast) return;
                toast.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: #00d5a4;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span><strong>${featureName}</strong> will be available soon</span>
                `;
                toast.classList.add("is-visible");
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove("is-visible");
                }, 2800);
            }

            document.querySelectorAll("[data-coming-soon]").forEach(el => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    const name = el.getAttribute("data-coming-soon");
                    showComingSoonToast(name);
                });
            });

            // Globe portal initialization and auto-spinning animation logic
            const globePortal = document.getElementById("globe-portal-container");
            const globeDiv = document.getElementById("home-globe");
            const fadeOverlay = document.querySelector(".fade-overlay");

            // Setup proximity glow outline for the globe container
            setupProximityGlow(globePortal, 250, 300);

            if (globePortal && globeDiv) {
                homeMap = new maplibregl.Map({
                    container: 'home-globe',
                    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                    projection: { type: 'globe' },
                    center: [-123.079, 0], // Centered at the equator to display a true, undistorted 3D sphere
                    zoom: 1.9, // Lower zoom level preserves highly pronounced 3D horizon curvature
                    minZoom: 1.5,
                    maxZoom: 3.5,
                    antialias: true,
                    attributionControl: false,
                    interactive: false
                });

                rotationId = null;
                isSpinning = true;

                // Reset transitions function for page load / bfcache back navigation
                function resetTransitions() {
                    // Force DOM reflow to guarantee the browser registers the initial offscreen state
                    if (globePortal) {
                        const reflow = globePortal.offsetHeight;
                    }
                    if (fadeOverlay) {
                        const reflow = fadeOverlay.offsetHeight;
                    }

                    // Remove transition classes to trigger reverse animation
                    if (fadeOverlay) {
                        fadeOverlay.classList.remove("is-active");
                    }
                    if (globePortal) {
                        globePortal.classList.remove("is-flying");
                    }

                    // Reset search state and clear markers
                    if (input) input.value = "";
                    if (dropdown) {
                        dropdown.style.display = "none";
                        dropdown.innerHTML = "";
                    }
                    currentMatches = [];
                    updateMapMarkers([]);
                    
                    // Reset MapLibre camera to original resting state (pitch: 0, zoom: 1.9, lat: 0)
                    try {
                        homeMap.easeTo({
                            pitch: 0,
                            zoom: 1.9, // Restores aligned scale on recovery
                            center: [homeMap.getCenter().lng, 0],
                            duration: 1000,
                            easing: (t) => 1 - Math.pow(1 - t, 4)
                        });
                    } catch (e) {
                        // Suppress map state errors if map is not fully loaded yet
                    }

                    isSpinning = true;
                    // Restart spinning loop if stopped
                    if (!rotationId) {
                        rotateGlobe();
                    }
                }

                // Listen for page transition show event (handles regular load & back/forward cache)
                window.addEventListener("pageshow", (event) => {
                    resetTransitions();
                });

                function rotateGlobe() {
                    if (!isSpinning) return;
                    try {
                        const center = homeMap.getCenter();
                        center.lng += 0.02; // speed of rotation (reduced for subtle architectural spin)
                        if (center.lng > 180) center.lng -= 360;
                        homeMap.setCenter(center);
                    } catch (e) {
                        // Suppress map center errors if page navigates mid-frame
                    }
                    rotationId = requestAnimationFrame(rotateGlobe);
                }

                // Helper to initialize search markers WebGL layer
                function addSearchMarkersLayer() {
                    try {
                        if (!homeMap) return;
                        if (!homeMap.getSource('search-markers')) {
                            homeMap.addSource('search-markers', {
                                type: 'geojson',
                                data: {
                                    type: 'FeatureCollection',
                                    features: []
                                }
                            });
                        }
                        
                        // Dynamically query global accent color from CSS variables
                        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim() || '#00d5a4';

                        if (!homeMap.getLayer('search-markers-layer')) {
                            homeMap.addLayer({
                                id: 'search-markers-layer',
                                type: 'circle',
                                source: 'search-markers',
                                paint: {
                                    'circle-radius': [
                                        'case',
                                        ['boolean', ['get', 'active'], false],
                                        3.25,
                                        2.5
                                    ],
                                    'circle-color': [
                                        'case',
                                        ['boolean', ['get', 'active'], false],
                                        accentColor,
                                        '#ffffff'
                                    ],
                                    'circle-stroke-width': 0
                                }
                            });
                        }
                    } catch (err) {
                        console.warn("addSearchMarkersLayer error:", err);
                    }
                }

                homeMap.on("style.load", () => {
                    try {
                        homeMap.setProjection({ type: 'globe' });
                        
                        // Hide all labels and borders for a clean landmass globe
                        const style = homeMap.getStyle();
                        if (style && style.layers) {
                            style.layers.forEach(layer => {
                                const id = layer.id.toLowerCase();
                                if (id.includes("label") || 
                                    id.includes("place") || 
                                    id.includes("poi") || 
                                    id.includes("boundary") || 
                                    id.includes("border") || 
                                    id.includes("admin")) {
                                    homeMap.setLayoutProperty(layer.id, "visibility", "none");
                                }
                            });
                        }
                        
                        addSearchMarkersLayer();
                    } catch (e) {
                        console.warn("style.load layout overrides error:", e);
                    }
                });

                homeMap.on("load", () => {
                    try {
                        homeMap.setProjection({ type: 'globe' });
                        
                        // Enforce label and border hiding on map load
                        const style = homeMap.getStyle();
                        if (style && style.layers) {
                            style.layers.forEach(layer => {
                                const id = layer.id.toLowerCase();
                                if (id.includes("label") || 
                                    id.includes("place") || 
                                    id.includes("poi") || 
                                    id.includes("boundary") || 
                                    id.includes("border") || 
                                    id.includes("admin")) {
                                    homeMap.setLayoutProperty(layer.id, "visibility", "none");
                                }
                            });
                        }
                        
                        addSearchMarkersLayer();
                    } catch (e) {
                        console.warn("load layout overrides error:", e);
                    }
                    
                    // Mark container loaded and fade out loading shimmer
                    globePortal.classList.add("loaded");
                    globeDiv.classList.add("is-loaded");
                    
                    // Start auto-rotation animation loop
                    rotateGlobe();
                });

                // On click transition flight
                globePortal.addEventListener("click", (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    // Stop auto rotation
                    isSpinning = false;
                    if (rotationId) cancelAnimationFrame(rotationId);

                    // Add transition flight class to container (slides the container straight up with no scale zoom)
                    globePortal.classList.add("is-flying");

                    // Fade screen to solid black
                    if (fadeOverlay) {
                        fadeOverlay.classList.add("is-active");
                    }

                    // Navigate to maps page after transition
                    setTimeout(() => {
                        window.location.href = "maps/";
                    }, 1000);
                });
            }

        });
    </script>


    <script src="scripts/mobile-bottom-nav.js?v=1" data-active-page="home" data-root="./"></script>
</body>
